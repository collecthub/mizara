/* Layout: phone-first app shell. Cocoa top bar (brand + language + licence), one scrolling view, bottom tab bar; on wide screens the tabs sit under the bar and content caps at 960px */
:root{color-scheme:light;
  --cocoa:#2B1913; --pistachio:#B3C47E; --cream:#F6F0E4; --gold:#D2AE5A; --raspberry:#93344A; --forest:#243228;
  --bg:#F6F0E4; --surface:#FFFDF8; --sunk:#EFE7D8; --line:#E4DACB; --ink:#2B1913; --muted:#7A6A60;
  --price:#93344A; --good:#3D7A4E; --warn:#A8670A; --bad:#B23A3A; --onbar:#F6F0E4;
  --f-word:"Fraunces",Georgia,serif; --f-ar:"El Messiri","IBM Plex Sans Arabic",serif; --f-kufi:"Reem Kufi","IBM Plex Sans Arabic",sans-serif;
  --f-num:"Unbounded","IBM Plex Sans Arabic",sans-serif; --f-body:"IBM Plex Sans Arabic",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--cocoa)}
.disp{font-family:var(--f-kufi)} html[lang="ar"] .disp{font-family:var(--f-ar)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--cocoa);color:var(--onbar);border-bottom:4px solid var(--pistachio);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.top-in{max-width:960px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .lg{height:40px;width:auto;flex:none;display:block}
.brand .nm{font-family:var(--f-word);font-weight:700;font-size:1.25rem;letter-spacing:.06em;line-height:1.05}
html[lang="ar"] .brand .nm{font-family:var(--f-ar);letter-spacing:0;font-size:1.35rem}
.brand .tg{display:block;font-family:var(--f-kufi);color:var(--gold);font-size:.74rem;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html[lang="ar"] .brand .tg{font-family:var(--f-ar)}
.top-act{display:flex;align-items:center;gap:8px;flex:none}
.lang{font:inherit;font-size:.8rem;font-weight:600;border:1px solid rgba(246,240,228,.35);background:transparent;color:var(--onbar);border-radius:999px;padding:4px 12px;cursor:pointer}
.lang:hover{border-color:var(--gold)}
.badge{font:inherit;font-size:.72rem;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap;cursor:pointer;border:0}
.badge.demo{background:rgba(210,174,90,.18);color:var(--gold);border:1px solid rgba(210,174,90,.5)}
.badge.lic{background:var(--pistachio);color:var(--forest)}
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 110px}
.view{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
nav.tabs{position:fixed;inset:auto 0 0 0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:flex;
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs button{flex:1;border:none;background:none;color:var(--muted);font:inherit;font-size:.72rem;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--ink);font-weight:700}
nav.tabs button[aria-current="page"] svg{background:var(--pistachio);color:var(--cocoa);border-radius:999px;padding:3px 14px;box-sizing:content-box}
@media (min-width:900px){
  nav.tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 60px);inset:auto;justify-content:center;gap:4px;border-top:none;border-bottom:1px solid var(--line);padding:0}
  nav.tabs button{flex:0 0 auto;flex-direction:row;gap:6px;font-size:.9rem;padding:10px 16px}
  nav.tabs button svg{width:18px;height:18px}
  main{padding-bottom:48px}
}
h1,h2,h3{margin:0;line-height:1.3;text-wrap:balance;font-family:var(--f-kufi);font-weight:700}
html[lang="ar"] h1,html[lang="ar"] h2,html[lang="ar"] h3{font-family:var(--f-ar)}
h1{font-size:1.5rem} h2{font-size:1.12rem} h3{font-size:1rem}
.muted{color:var(--muted)} .small{font-size:.85rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.fields{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
label{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--muted);min-width:0}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%;min-width:0}
input[inputmode=decimal]{direction:ltr;text-align:start;font-variant-numeric:tabular-nums}
html[lang="ar"] input[inputmode=decimal]{text-align:right}
/* Focus ring: cocoa on light surfaces (contrast above 3:1), gold only on the dark top bar */
:where(a,button,input,select,textarea,[tabindex]):focus-visible{outline:2px solid var(--cocoa);outline-offset:2px}
.top :where(a,button):focus-visible{outline-color:var(--gold)}
.ferr{color:var(--bad);font-size:.78rem;font-weight:600}
input[aria-invalid="true"]{border-color:var(--bad)}
button{font:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 14px;font-weight:500}
.btn:hover{border-color:var(--pistachio)}
.btn.main{background:var(--pistachio);border-color:var(--pistachio);color:var(--cocoa);font-weight:700}
.btn.main:hover{border-color:var(--cocoa)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.num{font-variant-numeric:tabular-nums;unicode-bidi:plaintext;white-space:nowrap}
.price{font-family:var(--f-num);font-weight:700;color:var(--price);unicode-bidi:plaintext;white-space:nowrap}
.pill{display:inline-block;font-size:.74rem;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}
.pill.lo{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.hero{background:var(--pistachio);color:var(--cocoa);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:auto -40px -60px auto;width:180px;height:180px;border-radius:50%;background:var(--cream);opacity:.35}
.hero .eyebrow{color:var(--cocoa);opacity:.75;font-size:.85rem;font-weight:600}
.hero .big{font-size:1.6rem;line-height:1.2}
.hero .sub{opacity:.85;font-size:.9rem}
.pcard{display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:start;color:inherit;font:inherit}
.pcard.card{border-top:4px solid var(--cocoa)}
.pcard:hover{border-color:var(--pistachio)}
.pcard .price{font-size:1.45rem}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:.85rem}
.kv span:nth-child(odd){color:var(--muted)}
.star{font-size:.72rem;font-weight:700;color:var(--cocoa);background:var(--pistachio);border-radius:999px;padding:2px 9px}
.alert{border-radius:14px;padding:12px 14px;background:color-mix(in srgb,var(--warn) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 40%,var(--line));font-size:.9rem}
.demo-bar{border-radius:14px;padding:12px 14px;background:color-mix(in srgb,var(--gold) 16%,var(--surface));border:1px solid color-mix(in srgb,var(--gold) 55%,var(--line));font-size:.9rem;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.editor{display:grid;gap:16px;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);align-items:start}
@media (max-width:820px){.editor{grid-template-columns:1fr}}
.ticket{position:sticky;top:calc(env(safe-area-inset-top,0px) + 124px);overflow:hidden;padding:0}
.ticket-head{background:color-mix(in srgb,var(--pistachio) 28%,var(--surface));padding:16px;border-bottom:1px dashed var(--line)}
.ticket-head .price{font-size:2.1rem;line-height:1.15}
.lines{display:flex;flex-direction:column}
.lrow{display:flex;justify-content:space-between;gap:10px;padding:6px 16px;border-bottom:1px dotted var(--line);font-size:.9rem}
.lrow:last-child{border-bottom:none}
.lrow.total{font-weight:700;border-top:1px solid var(--ink)}
.bar{height:10px;border-radius:999px;background:var(--sunk);display:flex;overflow:hidden;margin:12px 16px 0}
.bar span{height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;padding:6px 16px 10px;font-size:.74rem;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-inline-end:4px;vertical-align:middle}
.item{display:grid;grid-template-columns:minmax(0,1fr) 80px 48px 34px;gap:8px;align-items:end;padding:8px 0;border-bottom:1px solid var(--line)}
.item.two{grid-template-columns:minmax(0,1fr) 96px 34px}
@media (max-width:520px){.fields>.wide{grid-column:1/-1}} /* product name (and similar long text fields) take a full line on narrow screens */
/* Narrow screens: the name (ingredient, product or cost item) takes a full line; quantity / amount, unit and delete sit on the line below */
@media (max-width:520px){
  .item{grid-template-columns:96px minmax(0,1fr) 34px}
  .item.two{grid-template-columns:120px minmax(0,1fr) 34px}
  .item>.lf:first-child{grid-column:1/-1}
  .item.two>.xbtn{grid-column:3}
}
.item>.small,.item>.xbtn{padding-bottom:10px}
.item:last-child{border-bottom:none}
.item .cost{grid-column:1/-1;font-size:.78rem;color:var(--muted);margin-top:-4px}
.xbtn{border:none;background:none;color:var(--muted);font-size:1.1rem;padding:4px}
.xbtn:hover{color:var(--bad)}
.slider{display:flex;gap:10px;align-items:center}
.slider input[type=range]{flex:1;accent-color:var(--raspberry);padding:0;border:none;background:none}
.slider .num{min-width:3.5em;text-align:end;font-weight:700}
.lib{display:grid;grid-template-columns:minmax(0,1.4fr) repeat(3,minmax(0,.8fr)) minmax(0,.8fr) 34px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.lib.head{border-bottom:1px solid var(--line);padding:0 0 6px;font-size:.75rem;color:var(--muted)}
.lib .lt{color:var(--muted);font-size:.82rem;grid-column:1/-1}
.lib{align-items:end}.lib .lf{gap:3px;font-size:.74rem;color:var(--muted);white-space:nowrap}.lib .lf span{overflow:hidden;text-overflow:ellipsis}
.lib .lf.ln span{font-weight:600}
@media (max-width:640px){.lib{grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,.85fr) minmax(0,1.1fr) 28px;gap:6px}.lib input{padding:9px 6px}.lib select{padding:9px 2px;font-size:15px}.lib .ln{grid-column:1/-1}}
.item .lf{gap:3px;font-size:.74rem;color:var(--muted)}
.buy{display:inline-flex;align-items:center;text-decoration:none;background:var(--cocoa);border-color:var(--cocoa);color:var(--cream);font-weight:700}
.buy:hover{border-color:var(--raspberry)}
.recover{border:1px solid var(--bad);border-radius:16px;padding:16px;background:var(--surface);display:flex;flex-direction:column;gap:12px}
.more{display:flex;flex-direction:column;gap:10px}
.more-item{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.more-item img{width:48px;height:48px;border-radius:12px;display:block}
.more-item b{display:block}
.more-item a{text-decoration:none;white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:none;background:var(--surface);color:var(--muted);padding:7px 12px;font:inherit;font-size:.85rem}
.seg button[aria-pressed="true"]{background:var(--pistachio);color:var(--cocoa)}
canvas{max-width:100%;height:auto;border-radius:14px;border:1px solid var(--line);display:block}
#cv{width:auto;max-width:100%;max-height:340px;margin-inline:auto;cursor:zoom-in;box-shadow:0 6px 18px rgba(43,25,19,.12)}
.cvzoom{position:fixed;inset:0;z-index:20;background:rgba(20,12,9,.86);display:flex;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
.cvzoom img{max-width:100%;max-height:100%;border-radius:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--cocoa);color:var(--cream);border-radius:12px;padding:10px 16px;font-size:.9rem;max-width:calc(100% - 32px)}
.confirm{border:1px solid var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--surface));border-radius:12px;padding:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
textarea{min-height:150px}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.sig{text-align:center;font-size:.78rem;color:var(--muted);padding:8px 0 0}
.sig .by{display:inline-flex;align-items:center;gap:6px;vertical-align:middle}
.sig .by svg{width:16px;height:24px;flex:none}
.sig a{color:inherit;text-decoration:underline;cursor:pointer}
.sig b{font-family:var(--f-word);font-weight:700;letter-spacing:.04em}
html[lang="ar"] .sig b{font-family:var(--f-ar);letter-spacing:0}
@media (prefers-reduced-motion:no-preference){.btn,.pcard{transition:border-color .15s}}
</style>
</head><body>

const uid=()=>Math.random().toString(36).slice(2,9);
/* Typed numbers: Arabic digits and a comma are accepted, empty means 0; letters or a minus sign are refused with a message under the field */
function parseNum(v){const s=String(v).trim().replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[,٫]/g,'.');if(s==='')return 0;return(/^\d*\.?\d*$/.test(s)&&s!=='.')?parseFloat(s):null}
function markErr(el,bad){let m=el.nextElementSibling;if(!(m&&m.classList.contains('ferr')))m=null;
  if(bad){if(!m){m=document.createElement('span');m.className='ferr';m.id='e'+uid();m.setAttribute('aria-live','polite');el.after(m)}m.textContent=t().errNum;el.setAttribute('aria-invalid','true');el.setAttribute('aria-describedby',m.id)}
  else{if(m)m.remove();el.removeAttribute('aria-invalid');el.removeAttribute('aria-describedby')}}
function numField(el,apply){if(!el)return;el.oninput=e=>{const v=parseNum(e.target.value);markErr(el,v===null);if(v!==null)apply(v)}}

/* ================= pricing engine ================= */
/*CALC-START*/
function priceProduct(p,lib,s){
  const byId={};lib.forEach(x=>byId[x.id]=x);
  let ing=0,pack=0,missing=0;
  p.lines.forEach(l=>{const it=byId[l.lib];if(!it){missing++;return}
    const c=(+it.size>0)?(+it.price)/(+it.size)*(+l.q||0):0;
    if(it.type==='pack')pack+=c;else ing+=c});
  const waste=ing*(+p.waste||0);
  const rate=(+s.hours>0)?(+s.wage)/(+s.hours):0;
  const labor=(+p.hours||0)*rate;
  const fixed=(s.fixed||[]).reduce((a,f)=>a+(+f.a||0),0);
  const oh=fixed/Math.max(1,+s.batches||0);
  const energy=+p.energy||0;
  const batch=ing+waste+pack+energy+labor+oh;
  const y=+p.yield||0;
  const unit=y>0?batch/y:NaN;
  const fee=+s.fee||0, m=+p.margin||0, d=1-m-fee;
  const raw=d>0.05+1e-9?unit/d:NaN;
  const step=+s.step||0;
  const price=isFinite(raw)?(step>0?Math.ceil(raw/step-1e-9)*step:raw)+0:NaN;
  const feeAmt=isFinite(price)?price*fee:NaN;
  const profit=isFinite(price)?price-feeAmt-unit:NaN;
  const realM=isFinite(price)&&price>0?profit/price:(isFinite(price)?0:NaN);
  const bprofit=profit*y;
  const perHour=!isFinite(bprofit)?NaN:(+p.hours>0)?bprofit/(+p.hours):0;
  const floor=(1-fee)>0?unit/(1-fee):NaN;
  return {ing,waste,pack,energy,labor,oh,batch,unit,raw,price,feeAmt,profit,realM,bprofit,perHour,floor,missing,y,rate};
}
/*CALC-END*/

/* Data check, used for restore files and for the data saved on this device.
   Every field is checked for its type; numbers may be numbers or numeric text and come out as numbers.
   Only known fields are kept, so nothing unexpected reaches the screen. Returns null if anything is wrong. */
const isStr=v=>typeof v==='string';
const isObj=v=>!!v&&typeof v==='object'&&!Array.isArray(v);
function numOk(v){if(typeof v==='number')return isFinite(v)&&v>=0?v:null;if(isStr(v)&&/^\s*\d+(\.\d+)?\s*$/.test(v))return +v;return null}
function nameOk(o){const r={};
  if(o.nm!==undefined){if(!isObj(o.nm)||!isStr(o.nm.ar)||!isStr(o.nm.en))return null;r.nm={ar:o.nm.ar,en:o.nm.en}}
  if(o.name!==undefined){if(!isStr(o.name))return null;r.name=o.name}
  return(r.nm||r.name!==undefined)?r:null}
function cleanData(d){
  if(!isObj(d)||!Array.isArray(d.products)||!Array.isArray(d.lib)||!isObj(d.settings))return null;
  const lib=[];
  for(const it of d.lib){if(!isObj(it))return null;const n=nameOk(it),price=numOk(it.price),size=numOk(it.size);
    if(!n||!isStr(it.id)||!it.id||!['ing','pack'].includes(it.type)||!['g','ml','pc'].includes(it.unit)||price===null||size===null)return null;
    lib.push(Object.assign({id:it.id,type:it.type,price,size,unit:it.unit},n))}
  const products=[];
  for(const p of d.products){if(!isObj(p)||!isStr(p.id)||!p.id||!Array.isArray(p.lines))return null;const n=nameOk(p);if(!n)return null;
    const o=Object.assign({id:p.id},n);
    if(p.unitNm!==undefined){if(!isObj(p.unitNm)||!isStr(p.unitNm.ar)||!isStr(p.unitNm.en))return null;o.unitNm={ar:p.unitNm.ar,en:p.unitNm.en}}
    if(p.unit!==undefined){if(!isStr(p.unit))return null;o.unit=p.unit}
    if(o.unitNm===undefined&&o.unit===undefined)return null;
    for(const k of ['yield','waste','hours','energy','margin']){const v=numOk(p[k]);if(v===null)return null;o[k]=v}
    o.lines=[];for(const l of p.lines){if(!isObj(l)||!isStr(l.lib))return null;const q=numOk(l.q);if(q===null)return null;o.lines.push({lib:l.lib,q})}
    products.push(o)}
  const s=d.settings,st={};
  if(!CURS.some(c=>c.c===s.curCode)||![0,2,3].includes(+s.dec)||(s.shop!==undefined&&!isStr(s.shop))||(s.curLabel!==undefined&&!isStr(s.curLabel))||!Array.isArray(s.fixed))return null;
  st.shop=s.shop||'';st.curCode=s.curCode;st.curLabel=s.curLabel||'';st.dec=+s.dec;
  for(const k of ['wage','hours','batches','fee','step','alert']){const v=numOk(s[k]);if(v===null)return null;st[k]=v}
  if(st.fee>0.9)return null;
  st.fixed=[];for(const f of s.fixed){if(!isObj(f))return null;const n=nameOk(f),a=numOk(f.a);if(!n||a===null)return null;st.fixed.push(Object.assign({a},n))}
  return {v:1,settings:st,lib,products}}
function keepOf(d){d=isObj(d)?d:{};const l=d.lic;
  return {lang:['ar','en'].includes(d.lang)?d.lang:null,dev:isStr(d.dev)?d.dev:undefined,
    lic:isObj(l)&&isStr(l.key)&&isStr(l.inst)&&l.key&&l.inst?{key:l.key,inst:l.inst,tail:isStr(l.tail)?l.tail:l.key.slice(-4).toUpperCase(),at:isStr(l.at)?l.at:'',ok:numOk(l.ok)||0}:null}}

(function(){let raw=null;try{raw=localStorage.getItem(STORE)}catch(e){}

let CFG={storeId:'',productId:'',licenseApi:'',buyUrl:''};
async function loadCfg(){try{const r=await fetch('config.json',{cache:'no-store'});if(r.ok)CFG=Object.assign(CFG,await r.json())}catch(e){}}

async function lsCall(ep,fields){const base=(CFG.licenseApi||'').trim()?CFG.licenseApi.replace(/\/+$/,'')+'/':LS_API;
  const r=await fetch(base+ep,{method:'POST',headers:{'Accept':'application/json','Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(fields)});
  let d={};try{d=await r.json()}catch(e){}return d}
const viaWorker=()=>!!String(CFG.licenseApi||'').trim();
const lsMine=d=>viaWorker()?!!d:!!(d&&d.meta&&String(d.meta.store_id)===String(CFG.storeId)&&(!CFG.productId||String(d.meta.product_id)===String(CFG.productId)));
async function activate(key){const E=t().e;
  key=String(key||'').trim();if(!key||key.length>100)return E.empty;
  await loadCfg();if(!CFG.storeId&&!viaWorker())return E.cfg;
  let d;try{d=await lsCall('activate',{license_key:key,instance_name:deviceName()})}catch(e){return E.net}
  if(!d.activated){
    if(d.license_key&&lsMine(d)&&d.license_key.activation_limit&&d.license_key.activation_usage>=d.license_key.activation_limit)return E.full;
    if(d.error==='not-this-store')return E.other;
    if(d.error==='provider-unavailable')return E.net;
    return E.bad}
  if(!lsMine(d)){try{await lsCall('deactivate',{license_key:key,instance_id:d.instance.id})}catch(e){}return E.other}
  S.lic={key,inst:d.instance.id,tail:key.slice(-4).toUpperCase(),at:new Date().toISOString().slice(0,10),ok:Date.now()};save();return null}

  await loadCfg();

  if(d&&d.valid===true&&lsMine(d)&&!(d.license_key&&d.license_key.status==='disabled')){const was=licensed();S.lic.ok=Date.now();save();if(!was){toast(t().verified);render()}return}
  if(d&&(d.valid===false||(d.license_key&&d.license_key.status==='disabled')||(d.valid===true&&!lsMine(d)))){S.lic=null;save();toast(t().revoked);render()}}
async function deactivate(){if(!S.lic)return null;
  try{const d=await lsCall('deactivate',{license_key:S.lic.key,instance_id:S.lic.inst});if(!d.deactivated&&d.error)return t().e.deact+' '+d.error}catch(e){return t().e.net}

function viewCard(v){const x=t();

function drawCard(c){const x=t(),ar=S.lang==='ar';
  const nItems=S.products.filter(p=>isFinite(priceProduct(p,S.lib,S.settings).price)).length,nCols=Math.max(1,Math.ceil(nItems/8));
  c.width=nCols<=2?1080:90*2+nCols*500+(nCols-1)*70;c.height=1350;
  const g=c.getContext('2d'),W=c.width,H=c.height;
  const th={cocoa:{bg:'#2B1913',fg:'#F6F0E4',mu:'#C9B9A8',ac:'#D2AE5A',pr:'#B3C47E',ln:'#4A3329'},pistachio:{bg:'#B3C47E',fg:'#2B1913',mu:'#4C5A3A',ac:'#2B1913',pr:'#93344A',ln:'#9AAB66'},cream:{bg:'#F6F0E4',fg:'#2B1913',mu:'#7A6A60',ac:'#93344A',pr:'#93344A',ln:'#E4DACB'}}[cardStyle];
  const fD=ar?'"El Messiri"':'"Reem Kufi"',fB='"IBM Plex Sans Arabic"';
  g.fillStyle=th.bg;g.fillRect(0,0,W,H);g.direction=ar?'rtl':'ltr';g.textBaseline='alphabetic';
  const S0=ar?W-90:90,E0=ar?90:W-90;g.textAlign=ar?'right':'left';
  g.fillStyle=th.ac;g.font=`600 40px ${fD}, sans-serif`;g.fillText(x.cTitle,S0,150);
  g.fillStyle=th.fg;g.font=`700 84px ${fD}, sans-serif`;let title=S.settings.shop||x.cDefShop;while(g.measureText(title).width>W-180&&title.length>3)title=title.slice(0,-2);g.fillText(title,S0,252);
  g.strokeStyle=th.ln;g.lineWidth=3;g.beginPath();g.moveTo(90,300);g.lineTo(W-90,300);g.stroke();
  const items=S.products.map(p=>({p,r:priceProduct(p,S.lib,S.settings)})).filter(o=>isFinite(o.r.price));
  const PER=8,n=Math.max(1,items.length),cols=Math.ceil(n/PER),multi=cols>1,GAP=70,top=330,bot=H-150;
  const cw=(W-180-GAP*(cols-1))/cols,rowH=multi?(bot-top)/PER:Math.min(150,(bot-top)/Math.min(n,PER));
  const fN=multi?36:46,fU=multi?24:28,fP=multi?34:50;
  items.forEach((o,i)=>{const col=Math.floor(i/PER),row=i%PER,inCol=Math.min(PER,items.length-col*PER);
    const cs=ar?W-90-col*(cw+GAP):90+col*(cw+GAP),ce=ar?cs-cw:cs+cw,y=top+rowH*(row+0.62);
    g.font=`700 ${fP}px "Unbounded", ${fB}, sans-serif`;const pw=g.measureText(moneyTxt(o.r.price)).width;
    g.direction=ar?'rtl':'ltr';g.textAlign=ar?'right':'left';g.fillStyle=th.fg;g.font=`700 ${fN}px ${fD}, sans-serif`;
    let s=nm(o.p);while(g.measureText(s+'…').width>(multi?cw:cw-pw-28)&&s.length>3)s=s.slice(0,-1);if(s!==nm(o.p))s+='…';g.fillText(s,cs,y);
    g.fillStyle=th.mu;g.font=`400 ${fU}px ${fB}, sans-serif`;g.fillText(`${x.per} ${unitName(o.p)}`,cs,y+fU+10);
    g.textAlign=ar?'left':'right';g.fillStyle=th.pr;g.font=`700 ${fP}px "Unbounded", ${fB}, sans-serif`;g.fillText(moneyTxt(o.r.price),ce,multi?y+fU+12:y+8);
    if(row<inCol-1){const ly=y+rowH*0.5;g.strokeStyle=th.ln;g.lineWidth=1.5;g.beginPath();g.moveTo(Math.min(cs,ce),ly);g.lineTo(Math.max(cs,ce),ly);g.stroke()}});
  if(multi)for(let k=1;k<cols;k++){const lx=ar?W-90-k*(cw+GAP)+GAP/2:90+k*(cw+GAP)-GAP/2;g.strokeStyle=th.ln;g.lineWidth=2;g.beginPath();g.moveTo(lx,top+20);g.lineTo(lx,bot-10);g.stroke()}
  g.textAlign=ar?'right':'left';g.direction=ar?'rtl':'ltr';g.fillStyle=th.mu;g.font=`400 30px ${fB}, sans-serif`;g.fillText(x.cOrder,S0,H-80);
  if(!licensed()){g.save();g.translate(W/2,H/2);g.rotate(-0.5);g.textAlign='center';g.fillStyle='rgba(210,174,90,0.30)';g.font=`700 120px ${fD}, sans-serif`;g.fillText(x.cDemo,0,0);g.restore()}}

      <label>${x.sFee}<input id="s-fee" inputmode="decimal" value="${esc(+(s.fee*100).toFixed(2))}"></label><label>${x.sAlert}<input id="s-alert" inputmode="decimal" value="${esc(Math.round(s.alert*100))}"></label></div>
      <p class="small muted" style="margin:0" id="rateLine">${x.sRate} ${money(rate)}</p></section>
    <section class="card view" style="gap:10px"><div class="row between"><h2 id="l-fix">${wc(x.sFixH)}</h2><button class="btn" id="fAdd">${x.sFixAdd}</button></div>
      ${s.fixed.map((f,k)=>`<div class="item two"><label class="lf"><span>${x.item}</span><input data-fn="${k}" value="${esc(nm(f))}"></label><label class="lf"><span>${wc(x.amount)}</span><input data-fa="${k}" inputmode="decimal" value="${esc(f.a)}"></label><button class="xbtn" data-fx="${k}" aria-label="${x.del}">✕</button></div>`).join('')}
      <label>${x.sBatches}<input id="s-b" inputmode="decimal" value="${esc(s.batches)}"></label>
      <p class="small muted" style="margin:0" id="ohLine">${x.sFixLine(money(fx),money(fx/Math.max(1,s.batches)))}</p></section>
    <section class="card view" style="gap:10px"><h2>${x.sBkH}</h2><p class="small muted" style="margin:0">${x.sBkSub}</p>
      <div class="row"><button class="btn main" id="send" ${licensed()?'':'disabled'}>${x.sSend}</button><button class="btn" id="bk" ${licensed()?'':'disabled'}>${x.sBk}</button>
      <button class="btn" id="rsBtn" type="button" ${licensed()?'':'disabled'}>${x.sRs}</button><input type="file" id="rs" accept=".json,application/json" hidden tabindex="-1">
      <button class="btn danger" id="reset">${x.sReset}</button></div><div id="confirmBox"></div></section>
    <section class="card more" id="more" hidden></section>${sigLine()}`;
  const de=$('#deact');if(de)de.onclick=async()=>{de.disabled=true;const err=await deactivate();de.disabled=false;if(err)$('#actMsg').textContent=err;else{toast(x.deactDone);render()}};
  const act=$('#act');if(act)act.onclick=async()=>{act.disabled=true;const err=await activate($('#key').value);act.disabled=false;if(err)$('#actMsg').textContent=err;else{toast(x.actDone);render()}};
  const refresh=()=>{const f2=s.fixed.reduce((a,f)=>a+(+f.a||0),0);$('#ohLine').innerHTML=x.sFixLine(money(f2),money(f2/Math.max(1,s.batches)));$('#rateLine').innerHTML=`${x.sRate} ${money(s.hours>0?s.wage/s.hours:0)}`;
    $('#l-step').innerHTML=wc(x.sStep);$('#l-wage').innerHTML=wc(x.sWage);$('#l-fix').innerHTML=wc(x.sFixH);v.querySelectorAll('[data-fa]').forEach(el=>{el.previousElementSibling.innerHTML=wc(x.amount)})};
  const bind=(id,fn)=>{const el=$('#'+id);if(el){el.oninput=e=>{fn(e.target.value);save();renderShell();refresh()};el.onchange=el.oninput}};
  const bindN=(id,fn)=>{const el=$('#'+id);if(el)numField(el,val=>{fn(val);save();refresh()})};
  $('#s-ccode').onchange=e=>{const c=CURS.find(o=>o.c===e.target.value);s.curCode=c.c;if(c.c!=='OTHER'){s.dec=c.d;s.step=c.st}save();viewSettings(v);toast(x.curChanged)};
  bind('s-shop',val=>s.shop=val);bind('s-cl',val=>s.curLabel=val);bind('s-dec',val=>s.dec=+val);
  bindN('s-step',val=>s.step=val);bindN('s-wage',val=>s.wage=val);bindN('s-hours',val=>s.hours=val);bindN('s-fee',val=>s.fee=Math.min(0.9,val/100));bindN('s-alert',val=>s.alert=val/100);bindN('s-b',val=>s.batches=Math.max(1,val));
  v.querySelectorAll('[data-fn]').forEach(el=>el.oninput=e=>{s.fixed[+el.dataset.fn].name=e.target.value;save()});
  v.querySelectorAll('[data-fa]').forEach(el=>numField(el,val=>{s.fixed[+el.dataset.fa].a=val;save();refresh()}));
  v.querySelectorAll('[data-fx]').forEach(b=>b.onclick=()=>{s.fixed.splice(+b.dataset.fx,1);save();viewSettings(v)});
  $('#fAdd').onclick=()=>{s.fixed.push({name:'',a:0});save();viewSettings(v)};
  const bkName=()=>'mizara-backup-'+new Date().toISOString().slice(0,10)+'.json';
  const bkBlob=()=>new Blob([JSON.stringify(Object.assign({},S,{lic:null}))],{type:'application/json'});
  const bkSave=()=>{try{const a=document.createElement('a');a.download=bkName();a.href=URL.createObjectURL(bkBlob());document.body.appendChild(a);a.click();a.remove();return true}catch(e){return false}};
  $('#bk').onclick=()=>toast(bkSave()?x.bkDone:x.bkFail);
  $('#send').onclick=async()=>{try{const f=new File([bkBlob()],bkName(),{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:x.name});toast(x.sendHint);return}}catch(e){if(e&&e.name==='AbortError')return}
    toast(bkSave()?x.sendHint:x.bkFail)};
  bindRestore();
  $('#reset').onclick=()=>askReset($('#confirmBox'));
  loadMore($('#more'))}

/* ================= restore and reset (shared by Settings and the recovery screen) ================= */
function restoreFile(f,box){const x=t();
  if(f.size>5e6){toast(x.rsBad);return}
  const r=new FileReader();
  r.onload=()=>{let d=null;try{d=JSON.parse(r.result)}catch(_){}
    const c=cleanData(d);if(!c){toast(x.rsBad);return}   /* rejected: current data untouched */
    box.innerHTML=`<div class="confirm"><span>${x.rsQ}</span><button class="btn danger" id="rsYes">${x.rsYes}</button><button class="btn" id="rsNo">${x.cancel}</button></div>`;
    $('#rsYes').onclick=()=>{const keep={lic:S.lic,dev:S.dev,lang:S.lang};BROKEN=null;S=Object.assign(c,keep);save();toast(x.rsDone);go('home')};
    $('#rsNo').onclick=()=>{box.innerHTML=''};$('#rsYes').focus()};
  r.onerror=()=>toast(x.rsBad);r.readAsText(f)}
function bindRestore(){const b=$('#rsBtn'),i=$('#rs');if(!b||!i)return;
  b.onclick=()=>i.click();i.onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)restoreFile(f,$('#confirmBox'))}}
function askReset(box){const x=t();
  box.innerHTML=`<div class="confirm"><span>${x.sResetQ}</span><button class="btn danger" id="yes">${x.yes}</button><button class="btn" id="no">${x.cancel}</button></div>`;
  $('#yes').onclick=()=>{const keep={lic:S.lic,dev:S.dev,lang:S.lang};BROKEN=null;S=Object.assign(starter(),keep);save();toast(x.resetDone);go('home')};
  $('#no').onclick=()=>{box.innerHTML=''};$('#yes').focus()}

/* ================= recovery screen: shown instead of a blank page when saved data is damaged ================= */
function viewRecover(){const x=t();
  try{renderShell()}catch(_){}
  $('#tabs').innerHTML='';
  $('#view').innerHTML=`<section class="recover" role="alert"><h1>${x.recH}</h1><p style="margin:0">${x.recP}</p>
    <div class="row"><button class="btn main" id="rsBtn" type="button" ${licensed()?'':'disabled'}>${x.sRs}</button><input type="file" id="rs" accept=".json,application/json" hidden tabindex="-1">
    <button class="btn danger" id="reset">${x.sReset}</button></div><div id="confirmBox"></div></section>`;
  bindRestore();$('#reset').onclick=()=>askReset($('#confirmBox'))}

/* ================= More from Collect: shared list, never cached; built-in list if it cannot load ================= */
const SELF='mizara',MORE_URL='https://collecthub.github.io/products.json';
const MORE_FALLBACK=[ /* copy of the published products.json (2026-10-30); update it when a new Collect product launches */
  {id:'rasma',type:'web',name:{ar:'رسمة',en:'RASMA'},desc:{ar:'تسعير المستقلين: سعر الساعة وثلاث باقات وعرض سعر جاهز.',en:'Pricing for freelancers: hourly rate, three packages and a ready quote.'},url:'https://collecthub.github.io/rasma/',icon:'https://collecthub.github.io/rasma/icon-192.png'}];
let MORE=null;
async function loadMore(box){if(!box)return;
  if(!MORE){let list=null;try{const r=await fetch(MORE_URL,{cache:'no-store'});if(r.ok){const d=await r.json();if(d&&Array.isArray(d.products))list=d.products}}catch(e){}
    MORE=list||MORE_FALLBACK}
  const https=u=>typeof u==='string'&&/^https:\/\/[^\s"'<>]+$/.test(u);
  const txt=o=>o&&typeof o==='object'&&typeof o[S.lang]==='string'?o[S.lang]:'';
  const items=MORE.filter(p=>p&&typeof p==='object'&&p.id!==SELF&&https(p.url)&&txt(p.name)).slice(0,6);
  if(!items.length||!document.body.contains(box))return;
  const x=t();
  box.innerHTML=`<h2>${x.more}</h2>`+items.map(p=>`<div class="more-item">${https(p.icon)?`<img src="${esc(p.icon)}" alt="" width="48" height="48" loading="lazy">`:'<span></span>'}
    <div style="min-width:0"><b>${esc(txt(p.name))}</b><span class="small muted">${esc(txt(p.desc))}</span></div>
    <a class="btn" href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">${x.tryFree}</a></div>`).join('');
  box.querySelectorAll('img').forEach(im=>im.onerror=()=>{im.replaceWith(document.createElement('span'))});
  box.hidden=false}

/* ================= boot ================= */
render();loadCfg().then(()=>{if(buyOk()&&!BROKEN)render()});recheck(false);
if('serviceWorker' in navigator&&location.protocol==='https:'&&!/claude\.(ai|site)|claudeusercontent/.test(location.hostname)){navigator.serviceWorker.register('sw.js').catch(()=>{})}
})();
</script>
